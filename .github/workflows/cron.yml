name: Fortnite Rec Bot Cron

on:
  schedule:
    # 5分ごとに実行（GitHubの仕様上、多少前後することがあります）
    - cron: '*/5 * * * *'
  workflow_dispatch: # GitHubの画面から手動で実行するボタンも有効化

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          pip install discord.py gspread oauth2client

      - name: Bot実行
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py
